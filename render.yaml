# Render Blueprint: one public service (docs/SPEC.md section 15).
#
# The hub serves the landing page, the dashboard and both audited apps from one
# origin, so the apps' SameSite=Strict session cookies work inside the landing
# page's frame. It gets no ANTHROPIC_API_KEY (rule S12): the agents run on a
# laptop, and the dashboard only replays the exported snapshot.
#
# JUDGE_RULES is a secret set in the Render dashboard (sync: false), never in
# this public file, so reading the repo can't spoil the hidden rules.

services:
  - type: web
    name: fairplay
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements-game.txt
    startCommand: >-
      uvicorn hub.server:app --host 0.0.0.0 --port $PORT --workers 1
      --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JUDGE_RULES          # StreamVault copies, e.g. a=fee,b=none,c=maze,d=preticked (paste from oracle/judge_rules.secret)
        sync: false
      - key: PLANTED_SWITCH       # Door Run's planted rule for visitors: on or off
        value: "on"
      - key: ORACLE_SINK          # ground truth goes to private logs only
        value: stdout
      - key: DASHBOARD_URL        # the chooser page's link to the dashboard
        value: /dashboard.html
